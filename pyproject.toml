[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceradar"
version = "0.1.0"
description = "Multi-face detection with a stacked hourglass center heatmap (PyTorch)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "Pillow",
  "torch>=2.4",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["faceradar*"]
